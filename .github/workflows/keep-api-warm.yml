# Keeps the free Render API awake so the first visitor doesn't wait ~25 s.
# Free Render services sleep after 15 minutes without traffic.
# Note: GitHub may delay scheduled runs by a few minutes, and pauses them after
# 60 days without repository activity (re-enable from the Actions tab).
name: Keep API warm
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping health endpoint
        run: curl -fsS --max-time 60 https://one-water-backend.onrender.com/api/health || echo "API did not respond (will retry next run)"
